<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Messenger Loop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Kullanıcı Giriş Ekranı -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>💬 Messenger Loop</h1>
      <p>Giriş kodunu gir</p>
      <input id="codeInput" type="text" maxlength="20" placeholder="Örn: 123456" />
      <button id="loginBtn">Giriş Yap</button>
      <small id="loginError"></small>
    </div>
  </div>

  <!-- Sohbet Uygulaması -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="meAvatar">?</div>
        <span class="app-title" id="meRealName">...</span>
      </div>
      <div class="online-users-box">
        <h4>Çevrimiçi Kullanıcılar</h4>
        <ul id="onlineList" class="online-list"></ul>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div class="avatar" id="chatAvatar">M</div>
        <div class="chat-title">
          <strong>Messenger Loop</strong>
          <small>çevrimiçi</small>
        </div>
      </header>
      
      <div id="messages" class="messages"></div>
      
      <form id="messageForm" class="message-form">
        <input id="messageInput" type="text" placeholder="Bir mesaj yazın" autocomplete="off" />
        <button type="submit" title="Gönder">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
      </form>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
